[package]
name = "vitaslop-gamerun-recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The home of committed, content-free game-run recipes (recipes/<TITLE_ID>/*.recipe),
# the registry that maps a title id to a friendly name (games.toml), the agent-facing
# `play` binary that runs a recipe and prints a structured report, and the opt-in
# conformance test that replays every recipe against a privately-supplied game dump.
#
# The lib itself is tiny and engine-free (just the registry). The `play` binary and
# the conformance test use the native engine to actually run a title, so they pull in
# vitaslop-native.

[dependencies]
vitaslop-runtime = { path = "../vitaslop-runtime" }
vitaslop-native = { path = "../vitaslop-native" }

[[bin]]
name = "play"
path = "src/bin/play.rs"
