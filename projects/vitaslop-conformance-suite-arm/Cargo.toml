[package]
name = "vitaslop-conformance-suite-arm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A generic ARM conformance corpus: hand-written `asm` + seed state per case,
# with the machine-checkable lower half (assembled `[bin]`, expected `[out]`)
# regenerated by `regen` from an `as`/`qemu` oracle. No vitaslop engine
# dependency - anyone building an ARM core can run this corpus against it by
# reading README.md. The lib is an optional convenience for Rust harnesses; the
# format's source of truth is README.md.

[lib]
path = "src/lib.rs"

[[bin]]
name = "regen"
path = "src/bin/regen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
