description = """
Thumb subs that borrows: 5 - 8 = -3 sets N, clears C (borrow) and V. Checks the
NZCV model for subtraction under Thumb decode.
"""

mode = "thumb"

asm = '''
    subs  r0, r0, r1
'''

[in]
regs = { r0 = 5, r1 = 8 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
QBo=
'''

[out.regs]
r0 = 4294967293
r1 = 8

[out.flags]
n = true
z = false
c = false
v = false
