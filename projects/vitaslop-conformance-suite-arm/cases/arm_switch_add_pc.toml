description = """
The ARM switch idiom: a bounds check, then `addls pc, pc, rN, lsl #2` into a
table of branches (pc reads as the add + 8, so case 0 is the second word after
it and the word in between is the default). A data-processing instruction that
writes pc is a jump - lowering it as an ordinary register write runs on into the
default case.
"""

mode = "arm"

asm = '''
    cmp   r0, #3
    addls pc, pc, r0, lsl #2
    b     dflt
    b     c0
    b     c1
    b     c2
    b     c3
c0: mov   r1, #10
    b     done
c1: mov   r1, #11
    b     done
c2: mov   r1, #12
    b     done
c3: mov   r1, #13
    b     done
dflt:
    mov   r1, #99
done:
    mov   r2, #1
'''

[in]
regs = { r0 = 2 }

