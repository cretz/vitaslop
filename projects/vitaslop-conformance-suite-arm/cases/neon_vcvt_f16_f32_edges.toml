description = """
NEON vcvt.f16.f32 d4, q0 - the edges of the narrow: infinity, NaN, negative zero,
and a value too large for a half.

65520.0 is the interesting one. It is exactly halfway between the largest finite
half (65504) and the next value up, which does not exist - so round-to-nearest
takes it to infinity rather than clamping it to the maximum. A conversion that
saturates instead would be wrong here and right everywhere else, which is why the
case exists. NaN must survive as a NaN rather than collapse to an infinity, and
negative zero must keep its sign.
"""

mode = "thumb"

asm = '''
    vmov    d0, r0, r1
    vmov    d1, r2, r3
    vcvt.f16.f32 d4, q0
    vmov    r0, r1, d4
'''

# lane0 = 0x7f800000 (+inf), lane1 = 0x7fc00000 (NaN),
# lane2 = 0x80000000 (-0.0), lane3 = 0x477ff000 (65520.0, ties up to infinity)
[in]
regs = { r0 = 2139095040, r1 = 2143289344, r2 = 2147483648, r3 = 1199566848 }

