description = """
Thumb 64-bit subtract via subs + sbcs: exercises the runtime carry-in of sbc (the
borrow, i.e. NOT C, from the preceding subs), both the result and the NZCV it
sets. Low half 0 - 1 borrows, so the high half is 5 - 2 - 1 = 2.
"""

mode = "thumb"

asm = '''
    subs  r0, r0, r2
    sbcs  r1, r1, r3
'''

[in]
regs = { r0 = 0, r1 = 5, r2 = 1, r3 = 2 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
gBqZQQ==
'''

[out.regs]
r0 = 4294967295
r1 = 2
r2 = 1
r3 = 2

[out.flags]
n = false
z = false
c = true
v = false
