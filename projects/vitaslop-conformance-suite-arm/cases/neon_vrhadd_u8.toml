description = """
NEON vrhadd.u8/vhadd.u8: the rounding and truncating halving adds. Both must average in a
WIDER intermediate: 0xff and 0xff average to 0xff, where forming the sum in the byte lane
first wraps it to 0xfe and halves that to 0x7f. The rounding form differs from the plain
one wherever the sum is odd, which several lanes here are.
"""

mode = "thumb"

asm = '''
    vmov    d2, r0, r1
    vmov    d3, r2, r3
    vrhadd.u8 d0, d2, d3
    vhadd.u8  d1, d2, d3
    vmov    r0, r1, d0
    vmov    r2, r3, d1
'''

