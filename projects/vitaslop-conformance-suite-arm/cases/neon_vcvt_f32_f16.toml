description = """
NEON vcvt.f32.f16 q2, d1 - widen four IEEE binary16 values to four f32.

Half-float is how a 3D title stores vertex and animation data compactly, so this
appears in real code even though the A9 has no half-precision arithmetic. The
conversion is branchless in our emitter, which means every lane takes the same
path whatever it holds - so the lanes here are deliberately the four SHAPES that
path has to get right at once: a normal (1.0), a negative normal (-2.0), an
infinity, and the smallest subnormal. Destination is q2 so it does not overlap
the d1 source.
"""

mode = "thumb"

asm = '''
    vmov    d1, r0, r1
    vcvt.f32.f16 q2, d1
    vmov    r0, r1, d4
    vmov    r2, r3, d5
'''

# half0 = 0x3c00 (+1.0), half1 = 0xc000 (-2.0),
# half2 = 0x7c00 (+inf), half3 = 0x0001 (smallest subnormal, 2^-24)
[in]
regs = { r0 = 3221240832, r1 = 97280 }

