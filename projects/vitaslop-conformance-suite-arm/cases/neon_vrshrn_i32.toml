description = """
NEON vrshrn.i32 dD,qM,#n: the ROUNDING narrowing shift. Every seed is chosen so the
discarded bits' top bit is SET, so each lane rounds up by one and a truncating
implementation is off by exactly one in all four - the difference a plain vshrn would
hide if the seeds were even.
"""

mode = "thumb"

