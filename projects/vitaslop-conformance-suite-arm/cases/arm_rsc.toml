description = """
ARM-state reverse subtract with carry, the high word of a 64-bit negate or
reverse subtract (`rsbs lo ; rsc hi`): rsc reads the runtime carry (NOT borrow)
from the preceding rsbs. Negating 1 borrows, so the high word is 0 - 0 - 1.
The second pair is a flag-setting rscs of 7:0 minus 2:5 - its low half borrows
(0 - 5) and the high half is 7 - 2 - 1 = 4, with the carry it leaves.
"""

mode = "arm"

asm = '''
    rsbs  r0, r0, #0
    rsc   r1, r1, #0
    rsbs  r2, r4, r2
    rscs  r3, r5, r3
'''

[in]
regs = { r0 = 1, r1 = 0, r2 = 0, r3 = 7, r4 = 5, r5 = 2 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
AABw4gAQ4eICIHTgAzD14A==
'''

[out.regs]
r0 = 4294967295
r1 = 4294967295
r2 = 4294967291
r3 = 4
r4 = 5
r5 = 2

