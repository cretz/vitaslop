description = "ARMv6 modulo parallel add/sub set the APSR GE bits: signed forms per lane sum >= 0, an unsigned add its carry-out, an unsigned subtract no-borrow; halfword forms set two GE bits per lane. Each is read back by a sel of r0/r1 into the next register, so a wrong GE bit shows as a wrong byte."

