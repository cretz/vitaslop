description = """
Thumb-mode NEON integer immediates and a bitwise select: `vmov.i32` zero into a
q register, `vmov.i64` with a per-byte mask immediate (low word all ones), and
`vbif` (insert-if-false) taking the low word from one register and keeping the
other's high word - a vector "keep x, y from here, w from there" merge. Plus
`vbsl` and `vbit` on the same inputs, which select in the other two ways.
"""

mode = "thumb"

asm = '''
    vmov    d0, r0, r1
    vmov    d2, r2, r3
    vmov.i32 q4, #0
    vmov.i64 d1, #0x00000000ffffffff
    vorr    d3, d2, d2
    vbif    d3, d0, d1
    vorr    d5, d1, d1
    vbsl    d5, d0, d2
    vorr    d6, d2, d2
    vbit    d6, d0, d1
    vmov    r0, r1, d3
    vmov    r2, r3, d5
    vmov    r4, r5, d6
    vmov    r6, r7, d8
    vmov    r8, r9, d1
'''

# two distinct 64-bit patterns, so every select reads which word came from where
[in]
regs = { r0 = 287454020, r1 = 1432778632, r2 = 2578103244, r3 = 3723427584 }

