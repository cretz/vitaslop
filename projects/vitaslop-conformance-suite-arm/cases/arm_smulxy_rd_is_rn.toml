description = """
Signed halfword multiplies whose destination is also the first source: the
decoder must not read rd's field as an accumulator or refuse the overlap.
smulbb takes both bottom halves, smultb the top of rn and bottom of rm, smlabt
the bottom of rn and top of rm plus an accumulator.
"""

mode = "arm"

asm = '''
    smulbb r0, r0, r1
    smultb r2, r2, r3
    smlabt r4, r4, r5, r6
'''

