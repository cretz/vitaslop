description = """
The smallest end-to-end program: write "Hello, world\\n" to stdout and exit.
Exercises pc-relative addressing (adr), immediate loads, the host write path,
and exit, over the Linux-EABI host convention (write = r7 4, exit = r7 1).
"""

capture = "output"

asm = '''
    mov   r0, #1          @ fd = stdout
    adr   r1, msg         @ buf
    mov   r2, #13         @ len
    mov   r7, #4          @ write
    svc   #0

    mov   r0, #0          @ status
    mov   r7, #1          @ exit
    svc   #0

msg:
    .ascii "Hello, world\n"
'''

