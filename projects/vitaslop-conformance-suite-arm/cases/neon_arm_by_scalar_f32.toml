description = """
ARM-mode (A32) NEON float multiply / multiply-accumulate BY SCALAR, vdup from a
scalar, and a VFP vdiv with an immediate vmov - the instruction mix of a matrix
palette skinning loop in a retail title, which runs in ARM mode where most title
code is Thumb. The A32 and T32 NEON encodings differ in their top byte, so a
decode or lowering bug can sit in one mode only.

Each by-scalar form picks a different lane (d0[0], d0[1], d1[0], d1[1]) so a wrong
M-bit/index decode lands on a different value. All inputs and products are exact
in binary32, so the golden is independent of fused vs unfused rounding.
"""

mode = "arm"

asm = '''
    vmov    d0, r0, r1
    vmov    d1, r2, r3
    vmov    d16, r4, r5
    vmov    d17, r6, r7
    vmov    d18, r8, r9
    vmov    d19, r10, r11
    vmov    d20, r0, r2
    vmov    d21, r1, r3
    vmul.f32 q12, q8, d0[0]
    vmla.f32 q12, q9, d0[1]
    vmla.f32 q12, q10, d1[0]
    vmul.f32 q13, q8, d1[1]
    vdup.32 q4, d0[1]
    vmov.f32 s20, #1.0
    vdiv.f32 s21, s20, s2
    vmov    r0, r1, d24
    vmov    r2, r3, d25
    vmov    r4, r5, d26
    vmov    r6, r7, d27
    vmov    r8, r9, d8
    vmov    r10, r11, d9
    vmov    r12, s21
'''

