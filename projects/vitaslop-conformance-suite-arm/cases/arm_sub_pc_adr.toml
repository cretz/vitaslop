description = """
ARM `adr` backwards: `sub rd, pc, #imm` is how an assembler writes an address
BEFORE the instruction. pc reads as the instruction's address + 8. A decoder that
takes every pc-relative add/sub as the forward form (`add`) lands 2*imm off.
Every address is taken relative to r2 (the program's own start), because the
load address is the harness's choice: r0/r1/r3 end as 4, 12 and 20.
"""

mode = "arm"

asm = '''
    sub   r0, pc, #4
    add   r1, pc, #0
    sub   r2, pc, #16
    sub   r3, pc, #0
    sub   r0, r0, r2
    sub   r1, r1, r2
    sub   r3, r3, r2
    sub   r2, r2, r2
'''

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
BABP4gAQj+IQIE/iADBP4gIAQOACEEHgAjBD4AIgQuA=
'''

[out.regs]
r0 = 4
r1 = 12
r3 = 20

