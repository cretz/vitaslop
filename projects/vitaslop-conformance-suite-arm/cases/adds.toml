description = """
adds with unsigned overflow: 0xFFFFFFFF + 1 wraps r0 to 0 and sets the carry
and zero flags (n and v clear).
"""

asm = '''
    adds  r0, r0, r1
'''

[in]
regs = { r0 = 0xFFFFFFFF, r1 = 1 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
AQCQ4A==
'''

[out.regs]
r0 = 0
r1 = 1

[out.flags]
n = false
z = true
c = true
v = false
