description = """
NEON vpmin.u8/vpmax.u8: integer PAIRWISE min/max - adjacent element pairs within the
concatenation of the two sources are reduced, so the result's low half comes from dN and
its high half from dM. An implementation that reduces across the two registers instead of
within each gets every lane wrong.
"""

mode = "thumb"

asm = '''
    vmov    d2, r0, r1
    vmov    d3, r2, r3
    vpmin.u8 d0, d2, d3
    vpmax.u8 d1, d2, d3
    vmov    r0, r1, d0
    vmov    r2, r3, d1
'''

