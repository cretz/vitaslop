description = """
Thumb 64-bit add via adds + adcs: exercises the runtime carry-in of adc (the C
flag from the preceding adds), both the result and the NZCV it sets. Low half
0xFFFFFFFF + 1 carries into the high half 0 + 5 + 1 = 6.
"""

mode = "thumb"

asm = '''
    adds  r0, r0, r2
    adcs  r1, r1, r3
'''

[in]
regs = { r0 = 4294967295, r1 = 0, r2 = 1, r3 = 5 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
gBhZQQ==
'''

[out.regs]
r0 = 0
r1 = 6
r2 = 1
r3 = 5

[out.flags]
n = false
z = false
c = false
v = false
