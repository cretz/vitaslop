description = """
NEON vcvt.f16.f32 d4, q0 - narrow four f32 to four IEEE binary16, round to
nearest with ties to even.

This is the direction a retail title actually executes (it stores animation data
as half-float), and it is not the inverse of the widen: it has to round, and
rounding is where a nearly-right conversion differs from a right one. The four
lanes are a plain normal, a negative normal, and the two halfway cases that pin
the tie-break - 1 + 2^-11 and 1 + 3*2^-11 sit exactly between two representable
halves, and round-to-EVEN sends the first down and the second up.
"""

mode = "thumb"

asm = '''
    vmov    d0, r0, r1
    vmov    d1, r2, r3
    vcvt.f16.f32 d4, q0
    vmov    r0, r1, d4
'''

# lane0 = 0x3f800000 (+1.0), lane1 = 0xc0000000 (-2.0),
# lane2 = 0x3f801000 (1 + 2^-11, a tie), lane3 = 0x3f803000 (1 + 3*2^-11, a tie)
