description = """
Thumb UNPRIVILEGED loads and stores - `strt`, `strbt`, `strht`, `ldrt`, `ldrbt`, `ldrht`,
`ldrsbt`, `ldrsht` - which in a user-mode program are the plain accesses. A retail title's draw
path writes command words with `strt`; lifted as unsupported, each became a trap. Stores a word,
a byte and a half into stack slots and reads them back through every unprivileged load,
including the sign-extending ones.
"""

mode = "thumb"

asm = '''
    sub     sp, sp, #16
    mov     r1, sp
    movw    r4, #0x5678
    movt    r4, #0x1234
    strt    r4, [r1]
    movs    r5, #0xf0
    strbt   r5, [r1, #4]
    movw    r6, #0x8001
    strht   r6, [r1, #6]
    ldrt    r0, [r1]
    ldrbt   r2, [r1, #4]
    ldrsbt  r3, [r1, #4]
    ldrht   r7, [r1, #6]
    ldrsht  r8, [r1, #6]
    add     sp, sp, #16
    movs    r1, #0
'''

