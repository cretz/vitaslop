description = """
NEON vshll.u8 qD,dM,#n: widen each of eight bytes to 16 bits and shift left. The widening
has to happen FIRST - a value of 0xff shifted left by 2 inside a byte lane loses its top
bits, where the correct result is 0x03fc.
"""

mode = "thumb"

asm = '''
    vmov    d2, r0, r1
    vshll.u8 q0, d2, #2
    vmov    r0, r1, d0
    vmov    r2, r3, d1
'''

