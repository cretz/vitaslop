description = """
Thumb-mode NEON lane shuffles and pairwise adds: `vtrn.32` on two d-register
pairs, then `vpadd.f32` (pairwise across two sources, then a self-pairwise that
folds a vector to one sum). The shape a camera-ray builder uses to splat a
point's components and dot them against a matrix row. Every input and sum is
exact in binary32.
"""

mode = "thumb"

asm = '''
    vmov    d0, r0, r1
    vmov    d1, r2, r3
    vmov    d2, r4, r5
    vmov    d3, r6, r7
    vtrn.32 d0, d1
    vtrn.32 d2, d3
    vpadd.f32 d4, d0, d1
    vpadd.f32 d5, d4, d4
    vmov    r0, r1, d0
    vmov    r2, r3, d1
    vmov    r4, r5, d2
    vmov    r6, r7, d3
    vmov    r8, r9, d4
    vmov    r10, r11, d5
'''

