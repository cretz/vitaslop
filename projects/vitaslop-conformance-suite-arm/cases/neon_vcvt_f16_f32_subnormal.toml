description = """
NEON vcvt.f16.f32 d4, q0 - the subnormal boundary of the narrow.

Below 2^-14 a half has no implicit leading one and the conversion changes shape,
so this case walks across that line: the smallest NORMAL half, the largest
subnormal, the smallest subnormal, and a value exactly half of the smallest
subnormal - which round-to-even sends to zero rather than to the smallest
subnormal. An implementation that handles normals correctly and takes one path
for everything small passes every other case and fails this one.
"""

mode = "thumb"

asm = '''
    vmov    d0, r0, r1
    vmov    d1, r2, r3
    vcvt.f16.f32 d4, q0
    vmov    r0, r1, d4
'''

# lane0 = 0x38800000 (2^-14, smallest normal half), lane1 = 0x387fc000 (largest subnormal),
# lane2 = 0x33800000 (2^-24, smallest subnormal), lane3 = 0x33000000 (2^-25, ties to zero)
[in]
regs = { r0 = 947912704, r1 = 947896320, r2 = 864026624, r3 = 855638016 }

