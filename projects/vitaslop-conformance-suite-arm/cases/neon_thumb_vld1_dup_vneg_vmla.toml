description = """
Thumb-mode NEON loads of ONE 32-bit element replicated to every lane
(`vld1.32 {dN[]}`), from consecutive words on the stack, then `vneg.f32` on a
q register, float immediates into a d and a q register (`vmov.f32 #1.0`), a
`vorr` copy and `vmla.f32` q-by-q. The operand shapes a pick ray is built from:
three splatted coordinates, a 1.0 lane, negated and accumulated. Exact values.
"""

mode = "thumb"

asm = '''
    push    {r0, r1, r2, r3}
    mov     r12, sp
    vld1.32 {d2[]}, [r12]
    add     r12, sp, #4
    vld1.32 {d3[]}, [r12]
    add     r12, sp, #8
    vld1.32 {d0[]}, [r12]
    add     sp, sp, #16
    vmov.f32 d1, #1.0
    vtrn.32 d2, d3
    vtrn.32 d0, d1
    vorr    d3, d0, d0
    vneg.f32 q4, q1
    vmov.f32 q3, #1.0
    vmla.f32 q4, q1, q3
    vmov.f32 q5, #2.0
    vmla.f32 q5, q1, q1
    vmov    r0, r1, d2
    vmov    r2, r3, d3
    vmov    r4, r5, d8
    vmov    r6, r7, d9
    vmov    r8, r9, d10
    vmov    r10, r11, d11
    movs    r12, #0
'''

