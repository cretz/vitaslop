description = """
Saturating add/subtract: qadd/qsub clamp to 0x7fffffff / 0x80000000 instead of
wrapping, and qdadd/qdsub saturate the DOUBLING of the second operand before the
saturating add/subtract. The last qadd does not saturate (1 + 1).
"""

mode = "arm"

asm = '''
    qadd   r0, r1, r2
    qsub   r3, r4, r2
    qdadd  r5, r2, r1
    qdsub  r6, r2, r4
    qadd   r7, r2, r2
'''

[in]
regs = { r1 = 0x7FFFFFFF, r2 = 1, r4 = 0x80000000 }

