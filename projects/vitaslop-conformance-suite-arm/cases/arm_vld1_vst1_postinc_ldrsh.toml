description = """
ARM-mode (A32) NEON vld1/vst1 of FOUR d-registers with a REGISTER post-increment
(`[rn], rm`), and LDRSH with a post-indexed immediate offset below 16 - the load
and store shapes of a matrix palette skinning loop in a retail title. The ldrsh
form's offset high nibble is zero, which a decoder once rejected as reserved bits.

Eight seed words go to the stack, are loaded into d0-d3 with r6 advancing by r7
(32), stored back 32 bytes on, and read again; a halfword 0x8001 is loaded
sign-extended with r6 advancing by 2. r9 and r12 record how far the base moved; r6 itself is a stack address, so it
is cleared before the end.
"""

mode = "arm"

asm = '''
    sub     sp, sp, #128
    mov     r6, sp
    stmia   r6, {r0-r3, r8-r11}
    mov     r7, #32
    vld1.32 {d0, d1, d2, d3}, [r6], r7
    sub     r12, r6, sp
    vst1.32 {d0, d1, d2, d3}, [r6], r7
    vmov    r0, r1, d1
    vmov    r2, r3, d3
    ldr     r8, [sp, #36]
    ldr     r10, [sp, #60]
    movw    r4, #0x8001
    strh    r4, [sp, #64]
    add     r6, sp, #64
    ldrsh   r5, [r6], #2
    sub     r9, r6, sp
    mov     r6, #0
    add     sp, sp, #128
'''

