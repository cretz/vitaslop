description = """
Flag-setting multiplies set N and Z from the result (for the long forms, from
the whole 64-bit result: N is bit 63). Each flag is captured with a conditional
move before the next multiply replaces it: a negative `muls`, a `mlas` whose sum
is exactly zero, a `umulls` whose high word is small (N clear), and a `smlals`
that accumulates a negative product into zero (N set, left in the flags).
"""

mode = "arm"

asm = '''
    muls   r0, r1, r2
    movmi  r3, #1
    mlas   r4, r1, r5, r6
    moveq  r7, #1
    umulls r8, r9, r1, r2
    movpl  r10, #1
    smlals r11, r12, r1, r2
'''

[in]
regs = { r1 = 0xFFFFFFFD, r2 = 7, r5 = 1, r6 = 3 }

