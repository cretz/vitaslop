description = """
NEON vrshr.s16 dD,dM,#1: the same-width ROUNDING right shift, at the shift amount that
breaks the naive implementation. `(x + 1) >> 1` overflows a 16-bit lane when x is
0x7fff, so an implementation that adds the half-ulp in the lane's own width produces a
NEGATIVE result for the largest positive input; the correct answer is 0x4000. The
seeds cover that, a negative odd value, and -1 (which must round to 0).
"""

mode = "thumb"

asm = '''
    vmov    d2, r0, r1
    vrshr.s16 d0, d2, #1
    vmov    r0, r1, d0
'''

[in]
regs = { r0 = 4294934527, r1 = 4294901757 }

