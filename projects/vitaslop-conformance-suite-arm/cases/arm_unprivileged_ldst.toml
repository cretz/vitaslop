    mov     r5, #0xf0
    strbt   r5, [r1], #2
    movw    r6, #0x8001
    strh    r6, [r1]
    mov     r1, sp
    ldrt    r0, [r1], #4
    ldrbt   r2, [r1], #2
    ldrsht  r3, [r1], #0
    ldrht   r7, [r1], #2
    sub     r1, r1, sp
    add     sp, sp, #16
'''

