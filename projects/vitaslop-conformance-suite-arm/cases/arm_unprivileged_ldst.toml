description = """
ARM UNPRIVILEGED loads and stores, post-indexed as the ARM encodings always are - `strt`,
`strbt`, `ldrt`, `ldrbt`, `ldrht`, `ldrsht` - which in a user-mode program are the plain
accesses, base writeback included. Each step's base advance is visible in r1 at the end.
"""

mode = "arm"

asm = '''
    sub     sp, sp, #16
    mov     r1, sp
    movw    r4, #0x5678
