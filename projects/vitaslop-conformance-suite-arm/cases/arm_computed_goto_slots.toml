description = """
A hand-written COMPUTED-GOTO interpreter in ARM mode: `adr` a base once, then each
64-byte handler slot reads the next opcode byte and jumps to `base + op * 64` with
`bx`. A retail title converts its vertex streams this way. Nothing in the code
says how many slots there are (the index is a byte read at run time), so a
translator has to recover them from the slots themselves.

The program 00 01 01 02 00 02 03 runs every slot, some twice, in an order that
makes each slot's effect visible: slot 0 counts r1, slot 1 accumulates r1 into
r2, slot 2 doubles r3 and adds r2, slot 3 pops back to the caller. r0 ends as
how far the opcode pointer advanced (7), not as the stack address it was, and lr
is cleared after the call (its value is the load address).
"""

mode = "arm"

asm = '''
    sub     sp, sp, #16
    movw    r4, #0x0100
    movt    r4, #0x0201
    movw    r5, #0x0200
    movt    r5, #0x0003
    str     r4, [sp]
    str     r5, [sp, #4]
    mov     r0, sp
    mov     r1, #0
    mov     r2, #0
    mov     r3, #0
    bl      interp
    sub     r0, r0, sp
    mov     lr, #0
    add     sp, sp, #16
    b       fin
interp:
    push    {r4-r10, lr}
    adr     r10, slots
    ldrb    r4, [r0], #1
    add     r9, r10, r4, lsl #6
    bx      r9
    .balign 64
slots:
    add     r1, r1, #1
    ldrb    r4, [r0], #1
    add     r9, r10, r4, lsl #6
    bx      r9
    .balign 64
    add     r2, r2, r1
    ldrb    r4, [r0], #1
    add     r9, r10, r4, lsl #6
    bx      r9
    .balign 64
    add     r3, r2, r3, lsl #1
    ldrb    r4, [r0], #1
    add     r9, r10, r4, lsl #6
    bx      r9
    .balign 64
    pop     {r4-r10, pc}
    .balign 64
fin:
    mov     r6, #6
'''

