description = """
The byte, halfword and doubleword exclusive pairs on one word pair: LDREXB/STREXB
bump byte 0, LDREXH/STREXH bump the halfword at +2, then LDREXD/STREXD add one to
the 64-bit value across both words. Each STREX status (r3, r6, r12) must be 0 and
r8/r9 read the final words back. The halfword and doubleword forms need their
natural alignment, which an sp-relative 16-byte frame gives. Scratch addresses are
cleared before exit (sp differs between qemu and an engine).
"""

