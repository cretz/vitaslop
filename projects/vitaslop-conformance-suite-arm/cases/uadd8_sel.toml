description = "uadd8 + sel: byte-wise unsigned add sets APSR GE per byte (carry-out); sel selects rn/rm bytes by GE. Inputs chosen so byte2 sums to exactly 0x100 (carry, GE=1, result 0) and byte3 does not carry (GE=0). Core of optimized strlen/memchr."

mode = "thumb"

