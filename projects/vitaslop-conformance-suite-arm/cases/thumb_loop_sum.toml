description = """
A backward-branch Thumb loop: sum r0 down to 1 into r1. Exercises the dispatch
loop, a taken/not-taken conditional branch (bne), subs flags, and add - the same
shape as the cube's copy loops. For r0 = 10 the sum is 55 and r0 ends at 0.
"""

mode = "thumb"

asm = '''
    movs  r1, #0
loop:
    add   r1, r1, r0
    subs  r0, r0, #1
    bne   loop
'''

[in]
regs = { r0 = 10 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
ACEBRAE4/NE=
'''

[out.regs]
r0 = 0
r1 = 55

[out.flags]
n = false
z = true
c = true
v = false
