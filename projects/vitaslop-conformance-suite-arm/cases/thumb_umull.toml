description = """
Thumb unsigned 64-bit multiply: 0xFFFFFFFF * 0xFFFFFFFF = 0xFFFFFFFE00000001, so
the low half (r0) is 1 and the high half (r1) is 0xFFFFFFFE. Certifies UMULL.
"""

mode = "thumb"

asm = '''
    umull  r0, r1, r2, r3
'''

[in]
regs = { r2 = 4294967295, r3 = 4294967295 }

