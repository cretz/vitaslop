description = """
An IT block with both a then and an else instruction. r0 == r1 so the eq path
runs (r2 = 1) and the ne path does not (r3 stays 0). Checks that the transpiler
tracks IT state and predicates each body instruction correctly (yaxpeax decodes
them unconditionally).
"""

mode = "thumb"

asm = '''
    cmp   r0, r1
    ite   eq
    moveq r2, #1
    movne r3, #1
'''

[in]
regs = { r0 = 7, r1 = 7 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
iEIMvwEiASM=
'''

[out.regs]
r0 = 7
r1 = 7
r2 = 1

[out.flags]
n = false
z = true
c = true
v = false
