description = """
NEON vcvt.f32.f16 q2, d1 - the remaining shapes: a NaN, the largest finite half
(65504), negative zero, and the smallest NORMAL half (2^-14).

Split from the first case rather than folded into it because four lanes only
carry four values, and these four are the ones where a conversion that is nearly
right differs from one that is right: NaN must stay NaN rather than become an
infinity, -0.0 must keep its sign, and the normal/subnormal boundary is where the
exponent-scaling trick has to hand over to the multiply.
"""

mode = "thumb"

asm = '''
    vmov    d1, r0, r1
    vcvt.f32.f16 q2, d1
    vmov    r0, r1, d4
    vmov    r2, r3, d5
'''

# half0 = 0x7e00 (NaN), half1 = 0x7bff (65504, max finite),
# half2 = 0x8000 (-0.0), half3 = 0x0400 (2^-14, smallest normal)
[in]
regs = { r0 = 2080341504, r1 = 67141632 }

