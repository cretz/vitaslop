description = """
The exclusive monitor, one thread: LDREX arms it and the matching STREX stores
and reports 0; a second STREX with nothing armed reports 1 and stores nothing;
CLREX disarms an LDREX so the STREX after it also fails. r4 and r8 read the word
back to show which stores landed. The scratch address (sp-relative) is cleared
from r1 before exit because sp differs between qemu and an engine.
"""

mode = "thumb"

asm = '''
    sub   sp, sp, #16
    mov   r1, sp
    movs  r0, #5
    str   r0, [r1]
    ldrex r2, [r1]
    adds  r2, r2, #1
    strex r3, r2, [r1]
    ldr   r4, [r1]
    strex r5, r0, [r1]
    ldrex r6, [r1]
    clrex
    strex r7, r0, [r1]
    ldr   r8, [r1]
    add   sp, sp, #16
    movs  r1, #0
'''

[in]
regs = {}

