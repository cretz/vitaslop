description = """
Register-specified shifts use only the low byte of the shift register, and
amounts of 32 and above have their own carry rules: lsl/lsr by 32 give 0 with
carry = bit 0 / bit 31, by 33+ give 0 with carry clear; asr by 32+ fills with
the sign and the carry is the sign; ror by 32 leaves the value and sets carry to
bit 31. Each carry is captured with `adc rX, r12, #0` (r12 = 0) before the next
shift replaces it. r5 = 0x101 shifts by 1, not by 257.
"""

mode = "arm"

asm = '''
    movs  r0, r6, lsl r7
    adc   r8, r12, #0
    movs  r1, r6, lsr r9
    adc   r10, r12, #0
    movs  r2, r6, asr r11
    adc   r11, r12, #0
    adds  r3, r6, r6, lsl r5
    movs  r4, r6, ror r7
'''

[in]
regs = { r5 = 0x101, r6 = 0x80000001, r7 = 32, r9 = 33, r11 = 200 }

