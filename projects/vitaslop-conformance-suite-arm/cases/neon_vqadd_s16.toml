description = """
NEON vqadd.s16/vqsub.s16: saturating add and subtract. Every lane is chosen to overflow:
0x7fff + 1 must clamp to 0x7fff (not wrap to 0x8000), and 0x8000 - 1 must clamp to 0x8000.
A wrapping implementation gets the sign of the loudest sample backwards, which is a click.
"""

