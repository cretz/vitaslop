description = """
NEON vtbx.8 dD,{dN,dN+1},dM: the EXTEND form. It differs from vtbl only where the index
is out of range: there the destination byte is left as it was, so the seeded d0 has to
survive in exactly those lanes. Indices 0x10 and 0xff are the ones that test it - and
0xff also checks the range compare is UNSIGNED, since a signed one would call it in range.
"""

