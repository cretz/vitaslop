description = """
ARM ssat/usat: clamp a value into an n-bit signed / unsigned range.

The seeds cover every branch of both: a value that fits, one above the maximum, one below
the minimum, and - for usat - a NEGATIVE source, which must clamp to 0 rather than to the
maximum (it is read as signed, not as a huge unsigned). The shifted-operand form is
exercised too, since the shift happens BEFORE the saturation.
"""

mode = "thumb"

asm = '''
    ssat    r4, #16, r0
    ssat    r5, #16, r1
    ssat    r6, #16, r2
    usat    r7, #8, r3
    usat    r8, #8, r2
    ssat    r9, #16, r0, lsl #4
    mov     r0, r4
    mov     r1, r5
    mov     r2, r6
    mov     r3, r7
'''

[in]
regs = { r0 = 4660, r1 = 131072, r2 = 4294836224, r3 = 1000 }

