description = """
Thumb signed 64-bit multiply: -3 * 1000000 = -3000000 = 0xFFFFFFFFFFD26A80, so
the low half (r0) is 0xFFD26A80 and the high half (r1) is 0xFFFFFFFF. Certifies
SMULL (sign extension of both operands).
"""

mode = "thumb"

asm = '''
    smull  r0, r1, r2, r3
'''

[in]
regs = { r2 = 4294967293, r3 = 1000000 }

