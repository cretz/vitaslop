description = """
An immediate `lsr #32` / `asr #32` (encoded as shift 0) shifts the whole word
out: lsr gives 0 and asr the sign fill, and both leave bit 31 as the carry. The
operand form decides the carry, not the value it produces. The last add uses
`lsr #32` of all-ones as an operand of 0.
"""

mode = "arm"

asm = '''
    movs  r0, r1, lsr #32
    adc   r2, r3, #0
    movs  r4, r1, asr #32
    adds  r5, r1, r6, lsr #32
'''

[in]
regs = { r1 = 0x80000000, r6 = 0xFFFFFFFF }

