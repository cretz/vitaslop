description = """
NEON vqabs.s16/vqneg.s16: saturating absolute value and negate. The interesting lane is
0x8000, whose true magnitude is one past the 16-bit maximum: both must clamp to 0x7fff,
where the plain vabs/vneg would return 0x8000 (still negative). That input is what a
signal at full scale produces, so it is not a corner case in an audio path.
"""

mode = "thumb"

asm = '''
    vmov    d2, r0, r1
    vqabs.s16 d0, d2
    vqneg.s16 d1, d2
    vmov    r0, r1, d0
    vmov    r2, r3, d1
'''

[in]
regs = { r0 = 2147516413, r1 = 65535 }

