description = """
VFP scalar vcvtb/vcvtt.f16.f32 - narrow ONE f32 into the BOTTOM or TOP half of a
single-precision register, leaving the other half untouched.

That preservation is the point of the pair: a title packs two halves into one
register with a vcvtb then a vcvtt, and an implementation that zeroes the other
half (or writes all 32 bits) loses the first value. The seed puts a known pattern
in s4 first so both halves are visible. The values cover round-to-nearest-even
(1.00048828125 is exactly halfway between two halves and must round to even),
a subnormal (1e-6), infinity, NaN and +0.0.
"""

mode = "thumb"

asm = '''
    vmov    s0, r0
    vmov    s1, r1
    vmov    s2, r2
    vmov    s3, r3
    vmov    s4, r4
    vcvtb.f16.f32 s4, s0
    vmov    r5, s4
    vcvtt.f16.f32 s4, s1
    vmov    r6, s4
    vmov    s5, r4
    vcvtt.f16.f32 s5, s2
    vcvtb.f16.f32 s5, s3
    vmov    r7, s5
    vmov    s6, r4
    vcvtb.f16.f32 s6, s7
    vmov    r8, s6
'''

# r0 = 1.00048828125 (0x3f801000, a tie), r1 = 1e-6 (0x358637bd, subnormal half),
# r2 = +inf (0x7f800000), r3 = NaN (0x7fc00000), r4 = seed pattern 0xa5a55a5a,
# s7 = 0 is never written: the last narrow is of +0.0 (bottom half cleared, top kept).
[in]
regs = { r0 = 1065357312, r1 = 897988541, r2 = 2139095040, r3 = 2143289344, r4 = 2779077210 }

