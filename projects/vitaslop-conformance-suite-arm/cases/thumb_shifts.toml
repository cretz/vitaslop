description = """
Flag-setting immediate shifts. lsls by 31 leaves bit 31 set (N) with carry-out 0;
a following lsrs by 1 clears N and shifts a 1 out (C set). Checks the shifter
carry-out modelled for LSL/LSR.
"""

mode = "thumb"

