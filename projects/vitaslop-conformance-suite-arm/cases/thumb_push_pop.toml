description = """
Build a 32-bit constant with movw/movt, round-trip it through the stack with
push/pop. Exercises movw/movt, stmdb/ldmia (push/pop) against sp, and the guest
memory model. r1 ends equal to the constant.
"""

mode = "thumb"

asm = '''
    movw  r0, #0xBEEF
    movt  r0, #0xDEAD
    push  {r0}
    pop   {r1}
'''

