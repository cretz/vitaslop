description = """
The shape every guest atomic increment compiles to: an LDREX/add/STREX retry loop
(branching back while the status is non-zero), run three times, with a DMB between
iterations. On one thread no STREX may fail, so the counter ends at exactly 3 and
the last status is 0. Exercises the barrier (a fence under SMP codegen, nothing
otherwise) and the retry branch the monitor makes reachable. Thumb, as Vita code
is (the ARM-mode DMB encoding is not decoded yet).
"""

mode = "thumb"

asm = '''
    sub   sp, sp, #8
    mov   r1, sp
    movs  r0, #0
    str   r0, [r1]
    movs  r4, #3
again:
    ldrex r2, [r1]
    adds  r2, r2, #1
    strex r3, r2, [r1]
    cmp   r3, #0
    bne   again
    dmb   ish
    subs  r4, r4, #1
    bne   again
    ldr   r5, [r1]
    add   sp, sp, #8
    movs  r1, #0
'''

[in]
regs = {}

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
grBpRgAgCGADJFHoAC8BMkHoACMAK/jRv/NbjwE89NENaAKwACE=
'''

[out.regs]
r2 = 3
r5 = 3

[out.flags]
n = false
z = true
c = true
v = false
