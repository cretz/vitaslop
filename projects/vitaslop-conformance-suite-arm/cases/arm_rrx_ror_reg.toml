description = """
RRX rotates the carry flag in at bit 31 (and, flag-setting, takes bit 0 out as
the new carry); ROR by register rotates by the low byte, where an amount that is
a multiple of 256 (low byte 0) leaves both the value and the carry alone. The
first `movs` sets the carry from bit 0 of r1 so the rrx has a 1 to rotate in.
"""

mode = "arm"

asm = '''
    movs  r0, r1, lsr #1
    mov   r2, r3, rrx
    movs  r4, r3, rrx
    mov   r5, r6, ror r7
    movs  r8, r6, ror r9
'''

[in]
regs = { r1 = 3, r3 = 0x12345678, r6 = 0xF000000F, r7 = 4, r9 = 0x100 }

