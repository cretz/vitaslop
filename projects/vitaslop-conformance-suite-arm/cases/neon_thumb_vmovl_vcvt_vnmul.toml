description = """
Thumb-mode NEON byte-colour unpack: a packed RGBA word broadcast with `vdup.32`,
widened `vmovl.u8` then `vmovl.u16`, converted `vcvt.f32.u32` and scaled by a
splatted constant - the unpack a UI layer runs on a packed colour before it
hit-tests or blends. Then VFP `vnmul.f32` and `vneg.f32` on scalars. The scale
is a power of two so every product is exact.
"""

mode = "thumb"

asm = '''
    vdup.32 d0, r0
    vmovl.u8 q0, d0
    vmovl.u16 q0, d0
    vcvt.f32.u32 q0, q0
    vdup.32 q1, r1
    vmul.f32 q0, q0, q1
    vmov    s8, r2
    vmov    s9, r3
    vnmul.f32 s10, s8, s9
    vneg.f32 s11, s8
    vmov    r0, r1, d0
    vmov    r2, r3, d1
    vmov    r4, s10
    vmov    r5, s11
'''

# r0 = bytes 0x40, 0x10, 0xff, 0x80; r1 = 1/256; r2 = 1.5; r3 = -2.0
[in]
regs = { r0 = 2164199488, r1 = 998244352, r2 = 1069547520, r3 = 3221225472 }

