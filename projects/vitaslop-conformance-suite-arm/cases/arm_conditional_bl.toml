description = """
A conditional `bl` is a call only when its condition holds: the first `blne`
is not taken (r1 == 5) and must not run its callee, the second is taken. A
lowering that treats every bl as unconditional adds 1 to r0. lr is cleared at
the end: its value is the load address.
"""

mode = "arm"

asm = '''
    mov   r0, #0
    cmp   r1, #5
    blne  inc1
    cmp   r1, #4
    blne  inc16
    b     done
inc1:
    add   r0, r0, #1
    bx    lr
inc16:
    add   r0, r0, #16
    bx    lr
done:
    mov   r2, #1
    mov   lr, #0
'''

[in]
regs = { r1 = 5 }

# --- generated by `regen`; do not edit below this line ---
[bin]
base64 = '''
AACg4wUAUeMCAAAbBABR4wIAABsDAADqAQCA4h7/L+EQAIDiHv8v4QEgoOMA4KDj
'''

[out.regs]
r0 = 16
r1 = 5
r2 = 1

[out.flags]
n = false
z = false
c = true
v = false
