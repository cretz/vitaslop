[package]
name = "vitaslop-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vitaslop-transpiler = { path = "../vitaslop-transpiler" }
vitaslop-runtime = { path = "../vitaslop-runtime" }
# Native wasm engine. Only ever built for native hosts, so no cfg gating and no
# effect on the browser blob (which uses the browser's own WebAssembly).
wasmtime = "46"
# Precise validation errors on the emitted module (wasmtime only says which
# function failed to compile, not why).
wasmparser = "0.253"
# GPU backend for rendering the captured GXM stream. Native backends here; the
# browser path mirrors this over WebGPU in the web crate, sharing the WGSL.
wgpu = "22"
pollster = "0.3"
