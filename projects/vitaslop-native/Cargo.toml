[package]
name = "vitaslop-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vitaslop-transpiler = { path = "../vitaslop-transpiler" }
vitaslop-runtime = { path = "../vitaslop-runtime" }
# SELF/ELF loader. Used by the recipe runner's boot path (boot_retail) and the
# retail integration tests.
vitaslop-loader = { path = "../vitaslop-loader" }
# The shared cube render pipeline (shader, layout, per-draw encoding). The `gpu`
# feature pulls in wgpu here; the browser path enables the same feature.
vitaslop-platform = { path = "../vitaslop-platform", features = ["gpu"] }
# Native wasm engine. Only ever built for native hosts, so no cfg gating and no
# effect on the browser blob (which uses the browser's own WebAssembly).
wasmtime = "46"
# Precise validation errors on the emitted module (wasmtime only says which
# function failed to compile, not why).
wasmparser = "0.253"
# GPU backend for rendering the captured GXM stream. Native backends here; the
# browser path mirrors this over WebGPU in the web crate, sharing the pipeline.
wgpu = { workspace = true }
pollster = { workspace = true }
# Installs the fmt/EnvFilter subscriber in the probe tests and CLI tools so the
# runtime's `tracing` diagnostics surface via RUST_LOG (e.g. vitaslop::io=trace).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# This crate emits its own events too - the periodic stall dump in the scheduler,
# which has to be byte-comparable with the browser's to be worth anything.
tracing = { workspace = true }

