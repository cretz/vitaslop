[workspace]
resolver = "2"
members = [
    "vitaslop-conformance-harness",
    "vitaslop-conformance-suite-arm",
    "vitaslop-desktop",
    "vitaslop-loader",
    "vitaslop-native",
    "vitaslop-platform",
    "vitaslop-runtime",
    "vitaslop-transpiler",
    "vitaslop-web",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cretz/vitaslop"
publish = false

[workspace.dependencies]
tracing = "0.1"

# Browser wasm blob. Runtime perf first (opt-level 3 from release), size second.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
