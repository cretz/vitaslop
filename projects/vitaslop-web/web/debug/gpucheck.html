<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vitaslop webgpu check</title>
    <style>
      body { background:#0b0b12; color:#d8d8e0; font:15px/1.5 ui-monospace,Menlo,monospace; margin:0; padding:14px; }
      h1 { font-size:16px; color:#8fe0a0; margin:0 0 10px; }
      .row { border-bottom:1px solid #2a2a3a; padding:7px 0; }
      .k { color:#8a8a9a; font-size:12px; }
      .v { font-size:15px; word-break:break-all; }
      .ok { color:#8fe0a0; } .bad { color:#ff8080; }
      #copy { background:#8fe0a0; color:#08120c; border:0; border-radius:6px; padding:10px 16px; font:inherit; font-weight:700; margin-top:14px; }
    </style>
  </head>
  <body>
    <h1>vitaslop: where does WebGPU stop?</h1>
    <div id="out"><div class="row">running...</div></div>
    <button id="copy" type="button">copy all</button>

    <script>
      // >>> ONE QUESTION, ASKED IN BOTH PLACES.
      //
      // The emulator runs in a DEDICATED WORKER, not on the page. Every check written so far
      // asked the MAIN THREAD whether WebGPU works and then assumed the worker would agree.
      // Those are different contexts and a browser is free to treat them differently - so when a
      // device that had been working stopped handing over an adapter, nothing on hand could say
      // whether the loss was WebGPU, the origin, or the worker.
      //
      // This asks both, in the same page, and prints the two answers next to each other.
      const out = document.getElementById("out");
      const lines = [];
      const add = (k, v, good) => {
        lines.push(`${k}: ${v}`);
        const d = document.createElement("div");
        d.className = "row";
        d.innerHTML =
          `<div class="k">${k}</div><div class="v ${good === undefined ? "" : good ? "ok" : "bad"}">${v}</div>`;
        out.appendChild(d);
      };

      async function askHere() {
        const r = {};
        r.secure = self.isSecureContext;
        r.isolated = self.crossOriginIsolated;
        r.hasGpu = !!navigator.gpu;
        if (!navigator.gpu) return r;
        for (const [name, opts] of [
          ["high-performance", { powerPreference: "high-performance" }],
          ["default", {}],
          ["low-power", { powerPreference: "low-power" }],
          ["fallback", { forceFallbackAdapter: true }],
          ["compat(featureLevel)", { featureLevel: "compatibility" }],
          ["compat(legacy flag)", { compatibilityMode: true }],
          ["compat+low-power", { featureLevel: "compatibility", powerPreference: "low-power" }],
        ]) {
          try {
            const a = await navigator.gpu.requestAdapter(opts);
            r[name] = a ? `ADAPTER ${a.info?.vendor || "?"} / ${a.info?.architecture || "?"}` : "null";
          } catch (e) {
            r[name] = "threw: " + e;
          }
        }
        // >>> WHAT THE ADAPTER CAN DO, not just whether there is one.
        //
        // A fragment program that blends against the destination in ALU costs a RENDER-PASS
        // SPLIT per draw, and a tiler stores and reloads every tile at each one. A sports title
        // takes ~230 of them a frame. The ones that do not lower to a fixed-function blend are
        // all of the shape `dst * F + G`, where F and G are computed per pixel - which is
        // exactly what DUAL-SOURCE BLENDING expresses and nothing else in WebGPU's blend state
        // can. It is an OPTIONAL feature, so whether that fix is available at all is a property
        // of this device, and guessing it wrong is a day's work aimed at nothing.
        try {
          const a = await navigator.gpu.requestAdapter({});
          r.features = a ? [...a.features].sort().join(" ") || "(none)" : "no adapter";
          r.dualSource = a ? a.features.has("dual-source-blending") : false;
          r.maxTexture = a ? a.limits?.maxTextureDimension2D : "-";
        } catch (e) {
          r.features = "threw: " + e;
        }
        return r;
      }

      // The same routine, shipped into a worker as a blob so it needs no extra file and cannot
      // drift from the main-thread version above.
      const workerSrc = `
        self.onmessage = async () => {
          const r = { secure: self.isSecureContext, isolated: self.crossOriginIsolated, hasGpu: !!self.navigator.gpu };
          if (self.navigator.gpu) {
            for (const [name, opts] of [
              ["high-performance", { powerPreference: "high-performance" }],
              ["default", {}],
              ["low-power", { powerPreference: "low-power" }],
              ["fallback", { forceFallbackAdapter: true }],
              ["compat(featureLevel)", { featureLevel: "compatibility" }],
              ["compat(legacy flag)", { compatibilityMode: true }],
              ["compat+low-power", { featureLevel: "compatibility", powerPreference: "low-power" }],
            ]) {
              try {
                const a = await self.navigator.gpu.requestAdapter(opts);
                r[name] = a ? ("ADAPTER " + ((a.info && a.info.vendor) || "?") + " / " + ((a.info && a.info.architecture) || "?")) : "null";
              } catch (e) { r[name] = "threw: " + e; }
            }
            // The same feature question, asked where the emulator actually runs. A worker is a
            // different context and is free to answer differently - which is the whole premise
            // of this page.
            try {
              const a = await self.navigator.gpu.requestAdapter({});
              r.features = a ? [...a.features].sort().join(" ") || "(none)" : "no adapter";
              r.dualSource = a ? a.features.has("dual-source-blending") : false;
              r.maxTexture = a ? (a.limits && a.limits.maxTextureDimension2D) : "-";
            } catch (e) { r.features = "threw: " + e; }
          }
          self.postMessage(r);
        };`;

      function askInWorker() {
        return new Promise((done) => {
          try {
            const w = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
            const t = setTimeout(() => done({ error: "worker did not answer in 15s" }), 15000);
            w.onmessage = (e) => { clearTimeout(t); done(e.data); };
            w.onerror = (e) => { clearTimeout(t); done({ error: "worker error: " + (e.message || "died") }); };
            w.postMessage("go");
          } catch (e) {
            done({ error: "could not start worker: " + e });
          }
        });
      }

      (async () => {
        out.innerHTML = "";
        add("url", location.href);
        add("chrome", navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0] || navigator.userAgent);
        const here = await askHere();
        const there = await askInWorker();
        add("secure context", `page ${here.secure} / worker ${there.secure}`, here.secure);
        add("cross-origin isolated", `page ${here.isolated} / worker ${there.isolated}`);
        add("navigator.gpu present", `page ${here.hasGpu} / worker ${there.hasGpu}`, here.hasGpu);
        for (const k of ["high-performance", "default", "low-power", "fallback", "compat(featureLevel)", "compat(legacy flag)", "compat+low-power"]) {
          const p = here[k] ?? "-";
          const t = there[k] ?? there.error ?? "-";
          add(`requestAdapter(${k})`, `PAGE:   ${p}\nWORKER: ${t}`, String(p).startsWith("ADAPTER"));
        }
        add(
          "DUAL-SOURCE BLENDING",
          `page ${here.dualSource} / worker ${there.dualSource}`,
          !!there.dualSource
        );
        add("adapter features (page)", here.features ?? "-");
        add("adapter features (worker)", there.features ?? "-");
        add("maxTextureDimension2D", `page ${here.maxTexture} / worker ${there.maxTexture}`);
        if (there.error) add("worker", there.error, false);
        document.getElementById("copy").onclick = () => {
          navigator.clipboard.writeText(lines.join("\n")).then(
            () => (document.getElementById("copy").textContent = "copied"),
            () => (document.getElementById("copy").textContent = "copy failed - screenshot it")
          );
        };
      })();
    </script>
  </body>
</html>
