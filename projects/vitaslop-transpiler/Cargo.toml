[package]
name = "vitaslop-transpiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ARMv7/Thumb2 decode front-end, from our consolidation fork. During active
# co-development of the decoder and transpiler (the decode-completeness branch)
# this is intentionally a PATH dep on the sibling checkout, so decode fixes land
# immediately - committed as-is on the initial-development branch. RE-PIN to an
# exact pushed git rev before merging to main, for reproducible builds:
#   yaxpeax-arm = { git = "https://github.com/cretz/yaxpeax-arm", rev = "<sha>", ... }
yaxpeax-arm = { path = "../../../yaxpeax-arm", default-features = false, features = ["non-exhaustive-enums"] }
yaxpeax-arch = { version = "0.3.1", default-features = false }
# WASM backend.
wasm-encoder = "0.253"

[dev-dependencies]
# Validate emitted modules in unit tests.
wasmparser = "0.253"
