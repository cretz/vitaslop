[package]
name = "vitaslop-transpiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ARMv7/Thumb2 decode front-end, from our consolidation fork, pinned to an exact
# pushed rev so the workspace builds anywhere. It was a PATH dep on a sibling
# checkout during co-development of the decoder and the transpiler, which meant
# only this machine could build the repo - CI failed on every runner at once.
# To co-develop again, point it back at `path = "../../../yaxpeax-arm"` locally,
# then push the fork and re-pin here before merging.
yaxpeax-arm = { git = "https://github.com/cretz/yaxpeax-arm", rev = "57a5099a88647d981d611a6e5c5489a7fd0c70aa", default-features = false, features = ["non-exhaustive-enums"] }
yaxpeax-arch = { version = "0.3.1", default-features = false }
# WASM backend.
wasm-encoder = "0.253"

[dev-dependencies]
# Validate emitted modules in unit tests.
wasmparser = "0.253"
