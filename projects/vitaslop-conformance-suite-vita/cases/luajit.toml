category = "vita"
description = "Embedded LuaJIT 2.1, interpreter only, running a fixed script - RUNNABLE"

# Source: ../luajit-src/luajit.c, linked against newlib and the vitasdk LuaJIT package. The
# interpreter's opcode handlers are reached only through a dispatch table LuaJIT builds at
# start-up, so no static pass discovers them: the run translates them as they are first reached
# (vitaslop-native's runtime_code), and they tail-jump to one another for the whole script. The
# golden is the same program built for a desktop against LuaJIT 2.1 with its JIT off.
# Executable form: tests/vita_luajit.rs.
[out]
output = """
