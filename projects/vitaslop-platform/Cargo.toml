[package]
name = "vitaslop-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Pulls in wgpu and the shared cube render pipeline. Off by default so
# vitaslop-runtime (the engine-agnostic browser blob) can depend on this crate
# for the neutral seam types without dragging in a GPU stack. The frontends
# (vitaslop-native, vitaslop-web) enable it.
gpu = ["dep:wgpu", "dep:vitaslop-gxp-shader"]

[dependencies]
# Every renderer diagnostic goes through `tracing`, not `eprintln!`. On wasm32 stderr
# is a no-op sink, so an `eprintln!` here is invisible in the browser - which meant the
# recompiler's own fallback report, the one thing that says whether a frame was really
# drawn, was silently discarded on exactly the engine hardest to inspect.
tracing = { workspace = true }
wgpu = { workspace = true, optional = true }
# The clean-room GXP->WGSL recompiler, used only by the GPU `GxmRenderer` to link a
# guest vertex+fragment shader pair into a live pipeline (falls back to fixed-function
# on any LinkError). Its lib is wasm-safe, so the web build keeps working.
vitaslop-gxp-shader = { path = "../vitaslop-gxp-shader", optional = true }
