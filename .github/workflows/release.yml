# Build the desktop binary for every platform on a release tag and attach the archives to
# the GitHub release.
#
# Triggered by a `v*` tag - the same trigger as pages.yml, so the site and these binaries
# come from one commit. The release itself is created here if the tag has none yet
# (`gh release create`), as a draft-free release with generated notes; re-running the
# workflow re-uploads the assets with `--clobber`.
#
# The desktop binary embeds the web bundle (`vitaslop serve` hosts it; see
# vitaslop-desktop/build.rs), so the wasm bundle is built on every runner FIRST - a
# desktop build without it silently serves a page with no engine.
#
# Assets, per target: the PLAIN binary (`vitaslop-<tag>-<target>.{tar.gz,zip}`,
# for scripts and the curious) AND the platform's native form - a zipped `.app` bundle on
# macOS (unsigned: first launch is right-click -> Open; signing needs an Apple developer
# account) and an AppImage on Linux (one executable file, no install). Windows has one
# form: the `.exe` carries its icon already (see build.rs).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: vitaslop
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: vitaslop
          - os: macos-13
            target: x86_64-apple-darwin
            bin: vitaslop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: vitaslop.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
          key: release-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.126-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the wasm bundle the desktop binary embeds
        working-directory: projects/vitaslop-web
        run: node build.mjs

      - name: Build the desktop binary
        working-directory: projects
        run: cargo build --release --locked -p vitaslop-desktop --target ${{ matrix.target }}

      - name: Name the release
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="manual-${GITHUB_SHA::8}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=vitaslop-$tag-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C projects/target/${{ matrix.target }}/release -czf dist/${{ steps.meta.outputs.name }}.tar.gz ${{ matrix.bin }}

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path projects/target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath dist/${{ steps.meta.outputs.name }}.zip

      # macOS: the same binary inside an .app bundle, with the icon as .icns.
      - name: App bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          tag="${{ steps.meta.outputs.tag }}"
          app="dist/vitaslop.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp projects/target/${{ matrix.target }}/release/vitaslop "$app/Contents/MacOS/"
          sed "s/VERSION/${tag#v}/g" projects/vitaslop-desktop/assets/Info.plist > "$app/Contents/Info.plist"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s projects/vitaslop-desktop/assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 1024 ] && sips -z $d $d projects/vitaslop-desktop/assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          (cd dist && zip -qry "${{ steps.meta.outputs.name }}.app.zip" vitaslop.app && rm -rf vitaslop.app)

      # Linux: an AppImage - the binary, the .desktop entry and the icon in one file.
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          root=AppDir
          mkdir -p "$root/usr/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp projects/target/${{ matrix.target }}/release/vitaslop "$root/usr/bin/"
          cp projects/vitaslop-desktop/assets/vitaslop.desktop "$root/"
          cp projects/vitaslop-desktop/assets/vitaslop.desktop "$root/usr/share/applications/"
          cp projects/vitaslop-desktop/assets/icon.png "$root/vitaslop.png"
          cp projects/vitaslop-desktop/assets/icon.png "$root/usr/share/icons/hicolor/512x512/apps/vitaslop.png"
          echo '#!/bin/sh' > "$root/AppRun"
          echo 'exec "$(dirname "$(readlink -f "$0")")/usr/bin/vitaslop" "$@"' >> "$root/AppRun"
          chmod +x "$root/AppRun"
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # The runner has no FUSE; the tool can unpack itself instead of mounting.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$root" "dist/${{ steps.meta.outputs.name }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: build
    # A manual run builds and keeps the artifacts on the workflow run; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release if the tag has none, then upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ls -la dist
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
