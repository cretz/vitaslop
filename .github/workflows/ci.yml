name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build and test the whole workspace on all three desktop hosts, and check that nothing
  # generated has gone stale. The engine targets the browser, but the browser is not where
  # it gets debugged - the native path is the same code, so a difference between hosts is a
  # portability bug worth catching here rather than in a wasm build.
  #
  # `cargo test --workspace` is much more than unit tests. It runs BOTH conformance
  # corpora: the 40-case ARM corpus, pushed through the native engine and diffed against
  # its committed goldens, and the Vita suite - the committed clean-room cube plus the
  # kernel/GXM/threading/VFP/NEON cases - end to end through load -> transpile -> run ->
  # capture. That is the real coverage here; the per-crate unit tests are the smaller half.
  #
  # Nothing needs a GPU or a game dump. The cube's pixel test is a SOFTWARE rasterizer, and
  # the wgpu one skips itself when no adapter is present. Everything else that needs a
  # private fixture is `#[ignore]`d - the game dumps and the captured shader-blob corpus are
  # game-derived bytes that cannot live in a public runner - so a plain
  # `cargo test --workspace` is green for everyone, which is what this job asserts.
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects

      # The desktop frontend links a window/input stack. These are its Linux build
      # dependencies only - the crate is cross-platform and macOS/Windows ship the
      # equivalents in their SDKs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libx11-dev libxkbcommon-dev libwayland-dev

      # `--locked` throughout: CI must build the dependency set the committed lockfile
      # pins, which is the set a shipped artifact is built from. Letting cargo re-resolve
      # would test something nobody runs, and lockfile drift would never surface.
      - name: Build
        working-directory: projects
        run: cargo build --workspace --locked

      - name: Test
        working-directory: projects
        run: cargo test --workspace --locked

      # --- generated artifacts must be identical after regeneration --------------------
      # A stale golden is worse than no golden: it keeps passing while describing code
      # that no longer exists.
      #
      # `KNOBS.md` (the env-knob index) needs no step here - a normal unit test fails when
      # it goes stale, so the `Test` step above already covers it.
      #
      # The ARM corpus is the one case needing real tools. Its per-case `[bin]` and `[out]`
      # blocks are produced by assembling each case and running it under qemu, deliberately,
      # so no expected value is ever authored by hand (see that crate's README). qemu is a
      # strict black-box oracle: executed and observed, never read, linked or derived from.
      #
      # Note what this adds over the `Test` step, which is narrower than it looks: the ARM
      # cases running natively prove `[out]` still matches `[bin]`, because the engine runs
      # the committed BYTES. They cannot notice that the committed bytes no longer match the
      # committed `asm` - edit a case's assembly, forget to regenerate, and every test still
      # passes against the old program. Re-assembling is the only thing that catches it.
      #
      # Linux only: one leg is enough to prove the corpus is current, and it is where the
      # toolchain is a package rather than a download.
      - name: Install the ARM toolchain and qemu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi qemu-user

      # `regen` takes these from PATH as arm-none-eabi-{as,objcopy,ld} and qemu-arm
      # (overridable with ARM_AS / ARM_OBJCOPY / ARM_LD / QEMU). It rewrites only the
      # generated half of each case, deterministically, so an unchanged corpus produces no
      # diff at all - any diff means a committed golden is not what the oracle produces.
      - name: Regenerate the ARM conformance goldens and fail on any diff
        if: runner.os == 'Linux'
        working-directory: projects
        run: |
          cargo run --locked -p vitaslop-conformance-suite-arm --bin regen
          git diff --exit-code

  # The browser is the product, and the native job above never executes a byte of it: the
  # wasm build, the wasm-bindgen glue, the JSPI scheduler, OPFS storage, WebCodecs and the
  # WebGPU render all exist only in a browser. This job builds the bundle and runs the
  # browser suites that need no private fixture:
  #
  #   conformance.mjs      the ARM corpus on Chrome's WebAssembly engine, against the same
  #                        goldens the native job proves - identical behaviour on both engines
  #   opfs.mjs             guest file reads at offsets out of OPFS, on a synthetic fixture
  #   gamedata.mjs         the guest's saved state: a second OPFS tree, replace-not-append
  #   h264-conformance.mjs the H.264 crate's suite against WebCodecs (Chrome, not Chromium:
  #                        the codec is the proprietary one)
  #   run.mjs              the clean-room cube through WebGPU, on SwiftShader - a runner has
  #                        no GPU, and the harness refuses a software rasteriser unless told
  #
  # Chrome via Playwright's `chrome` channel, because that is the browser the page ships to
  # and the one with the codecs. The game-boot runs (a real title, a recipe) are NOT here:
  # they need a game dump, which cannot live in a public runner.
  web:
    name: web (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects

      # The CLI must match the pinned `wasm-bindgen` crate version exactly (see
      # vitaslop-web/Cargo.toml) or the generated glue refuses the wasm. Cached by version so
      # the install is paid once per bump, not per run.
      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.126-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/vitaslop-web/e2e/package-lock.json

      - name: Build the wasm bundle
        working-directory: projects/vitaslop-web
        run: node build.mjs

      - name: Install the browser test dependencies
        working-directory: projects/vitaslop-web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chrome

      - name: ARM conformance corpus on Chrome's wasm engine
        working-directory: projects/vitaslop-web/e2e
        run: node conformance.mjs

      - name: OPFS storage read path
        working-directory: projects/vitaslop-web/e2e
        run: node opfs.mjs

      - name: Game data persistence
        working-directory: projects/vitaslop-web/e2e
        run: node gamedata.mjs

      - name: H.264 conformance on WebCodecs
        working-directory: projects/vitaslop-web/e2e
        run: node h264-conformance.mjs

      - name: Cube through WebGPU (software rasteriser)
        working-directory: projects/vitaslop-web/e2e
        env:
          ALLOW_SOFTWARE: "1"
        run: node run.mjs

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: projects/vitaslop-web/e2e/screenshots
          if-no-files-found: ignore
